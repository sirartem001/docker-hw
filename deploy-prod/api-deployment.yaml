apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: api
  name: api
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: api
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: api
    spec:
      containers:
        - args:
            - uvicorn
            - api:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --reload
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: DATABASE_DSN
              value: postgres://bdu_user:bdu_pass@postgres:5432/bdu_db
          image: sirartem001/scrapers-api:latest
          name: api
          ports:
            - containerPort: 8000
              protocol: TCP
          volumeMounts:
            - mountPath: /app
              name: api-cm0
            - mountPath: /app/__pycache__
              name: api-claim1
      restartPolicy: Always
      volumes:
        - configMap:
            name: api-cm0
          name: api-cm0
        - name: api-claim1
          persistentVolumeClaim:
            claimName: api-claim1
