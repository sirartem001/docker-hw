apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.37.0 (HEAD)
  labels:
    io.kompose.service: worker
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: worker
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.37.0 (HEAD)
      labels:
        io.kompose.service: worker
    spec:
      containers:
        - args:
            - celery
            - -A
            - celery_app
            - worker
            - --loglevel=INFO
          env:
            - name: CELERY_BROKER_URL
              value: redis://redis:6379/0
            - name: CELERY_RESULT_BACKEND
              value: redis://redis:6379/0
            - name: DATABASE_DSN
              value: postgres://bdu_user:bdu_pass@postgres:5432/bdu_db
          image: sirartem001/scrapers-api:latest
          name: worker
          volumeMounts:
            - mountPath: /app
              name: worker-cm0
      restartPolicy: Always
      volumes:
        - configMap:
            name: worker-cm0
          name: worker-cm0
