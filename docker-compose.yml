services:
  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: bdu_user
      POSTGRES_PASSWORD: bdu_pass
      POSTGRES_DB: bdu_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  api:
    image: sirartem001/scrapers-api:v1 # Добавил в registry свой код
    restart: always
    environment:
      DATABASE_DSN: postgres://bdu_user:bdu_pass@postgres:5432/bdu_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app   
      - /app/__pycache__/
    ports:
      - "8000:8000"
    command: ["uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  worker:
    build: .
    restart: always
    environment:
      DATABASE_DSN: postgres://bdu_user:bdu_pass@postgres:5432/bdu_db
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      - api
      - redis
      - postgres
    volumes:
      - .:/app
    command: ["celery", "-A", "celery_app", "worker", "--loglevel=INFO"]

volumes:
  pgdata:
